      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldTeak)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="216" fill="#0f172a" stroke="url(#goldTeak)" stroke-width="4"/>
  
  <!-- Architectural Chair & Floor Lamp Graphic -->
  <!-- Vertical Backdrop Panelling -->
  <g opacity="0.35">
    <line x1="180" y1="130" x2="180" y2="350" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="210" y1="120" x2="210" y2="360" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="240" y1="115" x2="240" y2="365" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <line x1="272" y1="115" x2="272" y2="365" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <line x1="302" y1="120" x2="302" y2="360" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
    <line x1="332" y1="130" x2="332" y2="350" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Lamp Shade & Stem -->
  <polygon points="236,195 276,195 292,260 220,260" fill="url(#goldTeak)" opacity="0.95"/>
  <rect x="250" y="260" width="12" height="110" fill="#cbd5e1" rx="4"/>
  
  <!-- Curved Modern Lounge Chair Outer Frame -->
  <path d="M 120 256 C 120 340 180 395 256 395 C 332 395 392 340 392 256" fill="none" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
  <!-- Chair Cushion Inner Seat -->
  <path d="M 142 260 C 142 320 185 365 256 365 C 300 365 350 340 370 290 C 375 278 360 268 348 276 C 328 290 290 310 256 310 C 205 310 170 280 160 255 C 156 245 142 248 142 260 Z" fill="#e11d48" opacity="0.9"/>
  <!-- Chair Metal Legs -->
  <path d="M 190 410 Q 256 385 322 410" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>

  <!-- Brand Typography Arc / Monogram -->
  <text x="256" y="455" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="4" text-anchor="middle">R D FURNITURE</text>
  <text x="256" y="482" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#f59e0b" letter-spacing="6" text-anchor="middle">INTERIOR • EST. 1978</text>
